name: 🍎 MacOS

on:
  push:
    branches: [ master, all-features ]
  pull_request:
    branches: [ master, all-features ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CZKAWKA_OFFICIAL_BUILD: ${{ vars.CZKAWKA_OFFICIAL_BUILD }}

jobs:
  macos:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup env
        run: |
          ARCHNAME=$([ "${{ runner.arch }}" = "ARM64" ] && echo arm64 || echo x86_64)
          echo "ARCHNAME=$ARCHNAME" >> "$GITHUB_ENV"

      - name: Setup rust version
        run: rustup toolchain install --no-self-update && rustc --version --verbose

      - name: Install Homebrew
        run: /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"

      - name: Install native libraries
        run: |
          brew install libheif libavif dav1d || true

      - name: Build Release
        if: ${{ github.ref == 'refs/heads/master' }}
        run: |
          set -e
          sed -i '' 's/#lto = "thin"/lto = "thin"/g' Cargo.toml
          sed -i '' 's/#codegen-units /codegen-units /g' Cargo.toml
          
          echo "VERS=release" >> "$GITHUB_ENV"
          
          cargo build --locked --bin czkawka_cli --bin krokiet --release
          mv target/release/czkawka_cli mac_czkawka_cli_${{ env.ARCHNAME }}
          mv target/release/krokiet mac_krokiet_femtovg_opengl_${{ env.ARCHNAME }}
          cargo build --locked --release --bin krokiet --no-default-features --features "vello"
          mv target/release/krokiet mac_krokiet_vello_${{ env.ARCHNAME }}
          cargo build --locked --release --bin krokiet --no-default-features --features "femtovg_wgpu"
          mv target/release/krokiet mac_krokiet_femtovg_wgpu_${{ env.ARCHNAME }}
          cargo build --locked --release --bin krokiet --no-default-features --features "winit_femtovg,winit_software,femtovg_wgpu,vello"
          mv target/release/krokiet mac_krokiet_all_backends_${{ env.ARCHNAME }}
          
          cargo build --locked --release --features "heif,libavif"
          mv target/release/czkawka_cli mac_czkawka_cli_heif_avif_${{ env.ARCHNAME }}
          mv target/release/krokiet mac_krokiet_heif_avif_${{ env.ARCHNAME }}
          cargo build --locked --release --bin krokiet --no-default-features --features "vello,heif,libavif"
          mv target/release/krokiet mac_krokiet_vello_heif_avif_${{ env.ARCHNAME }}
          cargo build --locked --release --bin krokiet --no-default-features --features "femtovg_wgpu,heif,libavif"
          mv target/release/krokiet mac_krokiet_heif_avif_femtovg_wgpu_${{ env.ARCHNAME }}
          cargo build --locked --release --bin krokiet --no-default-features --features "winit_femtovg,winit_software,femtovg_wgpu,vello,heif,libavif"
          mv target/release/krokiet mac_krokiet_heif_avif_all_backends_${{ env.ARCHNAME }}

      - name: Build Debug
        if: ${{ github.ref != 'refs/heads/master' }}
        run: |
          set -e
          sed -i '' 's/^\(\[profile\.dev\.package.*\)/#\1/' Cargo.toml
          sed -i '' 's|^opt-level = 3 # OPT PACKAGES|#opt-level = 3 # OPT PACKAGES|' Cargo.toml
          
          echo "VERS=debug" >> "$GITHUB_ENV"
          
          cargo build --locked --bin czkawka_cli --bin krokiet --profile fastci
          mv target/fastci/czkawka_cli mac_czkawka_cli_${{ env.ARCHNAME }}
          mv target/fastci/krokiet mac_krokiet_femtovg_opengl_${{ env.ARCHNAME }}
          cargo build --locked --profile fastci --bin krokiet --no-default-features --features "vello"
          mv target/fastci/krokiet mac_krokiet_vello_${{ env.ARCHNAME }}
          cargo build --locked --profile fastci --bin krokiet --no-default-features --features "femtovg_wgpu"
          mv target/fastci/krokiet mac_krokiet_femtovg_wgpu_${{ env.ARCHNAME }}
          cargo build --locked --profile fastci --bin krokiet --no-default-features --features "winit_femtovg,winit_software,femtovg_wgpu,vello"
          mv target/fastci/krokiet mac_krokiet_all_backends_${{ env.ARCHNAME }}
          
          cargo build --locked --profile fastci --features "heif,libavif"
          mv target/fastci/czkawka_cli mac_czkawka_cli_heif_avif_${{ env.ARCHNAME }}
          mv target/fastci/krokiet mac_krokiet_heif_avif_${{ env.ARCHNAME }}
          cargo build --locked --profile fastci --bin krokiet --no-default-features --features "vello,heif,libavif"
          mv target/fastci/krokiet mac_krokiet_vello_heif_avif_${{ env.ARCHNAME }}
          cargo build --locked --profile fastci --bin krokiet --no-default-features --features "femtovg_wgpu,heif,libavif"
          mv target/fastci/krokiet mac_krokiet_heif_avif_femtovg_wgpu_${{ env.ARCHNAME }}
          cargo build --locked --profile fastci --bin krokiet --no-default-features --features "winit_femtovg,winit_software,femtovg_wgpu,vello,heif,libavif"
          mv target/fastci/krokiet mac_krokiet_heif_avif_all_backends_${{ env.ARCHNAME }}

      - name: Set default Krokiet backend
        run: cp mac_krokiet_femtovg_opengl_${{ env.ARCHNAME }} mac_krokiet_${{ env.ARCHNAME }}

      - name: Package krokiet with launchers
        run: |
          bash misc/pack_all_backends.sh mac_krokiet_all_backends_${{ env.ARCHNAME }} mac_krokiet_all_backends_${{ env.ARCHNAME }}.zip
          bash misc/pack_all_backends.sh mac_krokiet_heif_avif_all_backends_${{ env.ARCHNAME }} mac_krokiet_heif_avif_all_backends_${{ env.ARCHNAME }}.zip

      - name: Store MacOS
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: all-${{ runner.os }}-${{ runner.arch }}-${{ env.VERS }}
          path: |
            mac_krokiet_all_backends_${{ env.ARCHNAME }}.zip
            mac_czkawka_cli_heif_avif_${{ env.ARCHNAME }}
            mac_krokiet_heif_avif_${{ env.ARCHNAME }}
            mac_krokiet_vello_heif_avif_${{ env.ARCHNAME }}
            mac_krokiet_heif_avif_femtovg_wgpu_${{ env.ARCHNAME }}
            mac_krokiet_heif_avif_all_backends_${{ env.ARCHNAME }}.zip
            mac_czkawka_cli_${{ env.ARCHNAME }}
            mac_krokiet_${{ env.ARCHNAME }}
            mac_krokiet_femtovg_opengl_${{ env.ARCHNAME }}
            mac_krokiet_vello_${{ env.ARCHNAME }}
            mac_krokiet_femtovg_wgpu_${{ env.ARCHNAME }}

      - name: Release
        if: ${{ github.ref == 'refs/heads/master' && vars.HAVE_PAT_REPOSITORY_TOKEN == '1' }}
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: "Nightly"
          files: |
            mac_krokiet_all_backends_${{ env.ARCHNAME }}.zip
            mac_czkawka_cli_heif_avif_${{ env.ARCHNAME }}
            mac_krokiet_heif_avif_${{ env.ARCHNAME }}
            mac_krokiet_vello_heif_avif_${{ env.ARCHNAME }}
            mac_krokiet_heif_avif_femtovg_wgpu_${{ env.ARCHNAME }}
            mac_krokiet_heif_avif_all_backends_${{ env.ARCHNAME }}.zip
            mac_czkawka_cli_${{ env.ARCHNAME }}
            mac_krokiet_${{ env.ARCHNAME }}
            mac_krokiet_femtovg_opengl_${{ env.ARCHNAME }}
            mac_krokiet_vello_${{ env.ARCHNAME }}
            mac_krokiet_femtovg_wgpu_${{ env.ARCHNAME }}
          token: ${{ secrets.PAT_REPOSITORY }}
