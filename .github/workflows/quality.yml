name: 🧹 Quality

on:
  push:
    branches: [ master, main, all-features ]
  pull_request:
    branches: [ master, main, all-features ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache Cargo sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-sources-v1-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-sources-v1-

      - name: Install native libraries
        run: sudo apt update || true; sudo apt install -y libraw-dev libheif-dev libavif-dev libdav1d-dev libasound2-dev

      - name: Setup rust version
        run: |
          rustup default 1.94.1
          rustup component add rustfmt
          rustup component add clippy

      - name: Disable optimizations
        run: |
          sed -i 's/^\(\[profile\.dev\.package.*\)/#\1/' Cargo.toml
          sed -i 's|^opt-level = 3 # OPT PACKAGES|#opt-level = 3 # OPT PACKAGES|' Cargo.toml

      - name: Check the format
        run: |
          cargo fmt --version
          cargo fmt --all -- --check

      - name: Run clippy
        run: |
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --locked --all-targets --no-default-features --features winit_software -- -D warnings

      - name: Run regression tests
        run: cargo test --locked --workspace
