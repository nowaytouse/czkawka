name: 🏁 Windows

on:
  push:
    branches: [ master, all-features ]
  pull_request:
    branches: [ master, all-features ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CZKAWKA_OFFICIAL_BUILD: ${{ vars.CZKAWKA_OFFICIAL_BUILD }}

jobs:
  krokiet-windows:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: |
          sudo apt update || true
          sudo apt install -y mingw-w64 mingw-w64-x86-64-dev wget wget2 curl wine || true

      - name: Setup rust version
        run: |
          rustup default stable
          rustup target add x86_64-pc-windows-gnu

      - name: Download rcedit
        run: |
          curl -L https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe -o rcedit-x64.exe

      - name: Compile Krokiet Release
        if: ${{ github.ref == 'refs/heads/master' }}
        run: |
          sed -i 's/#lto = /lto = /g' Cargo.toml
          sed -i 's/#codegen-units /codegen-units /g' Cargo.toml
          cargo build --release --target x86_64-pc-windows-gnu --bin krokiet --bin czkawka_cli
          mv target/x86_64-pc-windows-gnu/release/krokiet.exe windows_krokiet.exe
          mv target/x86_64-pc-windows-gnu/release/czkawka_cli.exe windows_czkawka_cli.exe
          cargo build --release --target x86_64-pc-windows-gnu --bin krokiet --no-default-features --features "femtovg_wgpu"
          mv target/x86_64-pc-windows-gnu/release/krokiet.exe windows_krokiet_femtovg_wgpu.exe
          cargo build --release --target x86_64-pc-windows-gnu --bin krokiet --no-default-features --features "vello"
          mv target/x86_64-pc-windows-gnu/release/krokiet.exe windows_krokiet_vello.exe
          cargo build --release --target x86_64-pc-windows-gnu --bin krokiet --no-default-features --features "winit_femtovg,winit_software,femtovg_wgpu,vello"
          mv target/x86_64-pc-windows-gnu/release/krokiet.exe windows_krokiet_all_backends.exe
          
          WINEPREFIX=$(mktemp -d)
          export WINEPREFIX
          for exe in windows_krokiet*.exe; do wine rcedit-x64.exe "$exe" --set-icon krokiet/icons/krokiet_logo_flag.ico; done
          bash misc/pack_all_backends.sh windows_krokiet_all_backends.exe windows_krokiet_all_backends.zip windows

      - name: Compile Krokiet Debug
        if: ${{ github.ref != 'refs/heads/master' }}
        run: |
          sed -i 's/^\(\[profile\.dev\.package.*\)/#\1/' Cargo.toml
          sed -i 's|^opt-level = 3 # OPT PACKAGES|#opt-level = 3 # OPT PACKAGES|' Cargo.toml
          cargo build --target x86_64-pc-windows-gnu --bin krokiet --bin czkawka_cli
          mv target/x86_64-pc-windows-gnu/debug/krokiet.exe windows_krokiet.exe
          mv target/x86_64-pc-windows-gnu/debug/czkawka_cli.exe windows_czkawka_cli.exe
          cargo build --target x86_64-pc-windows-gnu --bin krokiet --no-default-features --features "femtovg_wgpu"
          mv target/x86_64-pc-windows-gnu/debug/krokiet.exe windows_krokiet_femtovg_wgpu.exe
          cargo build --target x86_64-pc-windows-gnu --bin krokiet --no-default-features --features "vello"
          mv target/x86_64-pc-windows-gnu/debug/krokiet.exe windows_krokiet_vello.exe
          cargo build --target x86_64-pc-windows-gnu --bin krokiet --no-default-features --features "winit_femtovg,winit_software,femtovg_wgpu,vello"
          mv target/x86_64-pc-windows-gnu/debug/krokiet.exe windows_krokiet_all_backends.exe
          
          WINEPREFIX=$(mktemp -d)
          export WINEPREFIX
          for exe in windows_krokiet*.exe; do wine rcedit-x64.exe "$exe" --set-icon krokiet/icons/krokiet_logo_flag.ico; done
          bash misc/pack_all_backends.sh windows_krokiet_all_backends.exe windows_krokiet_all_backends.zip windows

      - name: Pack with 7z
        run: |
          time 7z a -t7z -mx=3 czkawka_all.7z \
            windows_krokiet.exe \
            windows_krokiet_femtovg_wgpu.exe \
            windows_krokiet_vello.exe \
            windows_krokiet_all_backends.zip \
            windows_czkawka_cli.exe

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: krokiet-windows-${{ github.sha }}
          path: |
            czkawka_all.7z
          if-no-files-found: error

      - name: Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        if: ${{ github.ref == 'refs/heads/master' && vars.HAVE_PAT_REPOSITORY_TOKEN == '1' }}
        with:
          tag_name: "Nightly"
          files: |
            windows_krokiet.exe
            windows_krokiet_femtovg_wgpu.exe
            windows_krokiet_vello.exe
            windows_krokiet_all_backends.zip
            windows_czkawka_cli.exe
          token: ${{ secrets.PAT_REPOSITORY }}

  krokiet-compiled-on-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup rust version
        run: |
          rustup default stable

      - name: Download rcedit
        run: |
          curl -L https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe -o rcedit-x64.exe

      - name: Compile Krokiet Release
        if: ${{ github.ref == 'refs/heads/master' }}
        run: |
          powershell -Command "(Get-Content Cargo.toml) -replace '#lto = ', 'lto = ' | Set-Content Cargo.toml; (Get-Content Cargo.toml) -replace '#codegen-units ', 'codegen-units ' | Set-Content Cargo.toml"
          cargo build --release --bin krokiet --no-default-features --features "vello"
          mv target/release/krokiet.exe windows_krokiet_on_windows_vello.exe
          cargo build --release --bin krokiet --no-default-features --features "femtovg_wgpu"
          mv target/release/krokiet.exe windows_krokiet_on_windows_femtovg_wgpu.exe
          cargo build --release --bin krokiet --no-default-features --features "winit_femtovg,winit_software,vello,femtovg_wgpu"
          mv target/release/krokiet.exe windows_krokiet_on_windows_all_backends.exe
          Get-ChildItem windows_krokiet_on_windows_*.exe | ForEach-Object { ./rcedit-x64.exe $_.Name --set-icon krokiet/icons/krokiet_logo_flag.ico }

      - name: Compile Krokiet Debug
        if: ${{ github.ref != 'refs/heads/master' }}
        run: |
          (Get-Content Cargo.toml) -replace '#lto = ','lto = ' -replace '#codegen-units ','codegen-units ' -replace '^\[profile\.dev\.package','#\[profile.dev.package' -replace '^opt-level = 3 # OPT PACKAGES','#opt-level = 3 # OPT PACKAGES' | Set-Content Cargo.toml
          
          cargo build --bin krokiet --no-default-features --features "vello"
          mv target/debug/krokiet.exe windows_krokiet_on_windows_vello.exe
          cargo build --bin krokiet --no-default-features --features "femtovg_wgpu"
          mv target/debug/krokiet.exe windows_krokiet_on_windows_femtovg_wgpu.exe
          cargo build --bin krokiet --no-default-features --features "winit_femtovg,winit_software,vello,femtovg_wgpu"
          mv target/debug/krokiet.exe windows_krokiet_on_windows_all_backends.exe
          
          Get-ChildItem windows_krokiet_on_windows_*.exe | ForEach-Object { ./rcedit-x64.exe $_.Name --set-icon krokiet/icons/krokiet_logo_flag.ico }

      - name: Package krokiet with launchers
        shell: pwsh
        run: ./misc/pack_all_backends.ps1 -Binary windows_krokiet_on_windows_all_backends.exe -OutputZip windows_krokiet_on_windows_all_backends.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: krokiet-windows-on-windows-${{ github.sha }}
          path: |
            windows_krokiet_on_windows_all_backends.zip
            windows_krokiet_on_windows_vello.exe
            windows_krokiet_on_windows_femtovg_wgpu.exe
          if-no-files-found: error

      - name: Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        if: ${{ github.ref == 'refs/heads/master' && vars.HAVE_PAT_REPOSITORY_TOKEN == '1' }}
        with:
          tag_name: "Nightly"
          files: |
            windows_krokiet_on_windows_all_backends.zip
            windows_krokiet_on_windows_vello.exe
            windows_krokiet_on_windows_femtovg_wgpu.exe
          token: ${{ secrets.PAT_REPOSITORY }}

  windows-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup rust version
        run: |
          rustup default stable

      # Additional features are non-testable due really complicated setup of environment on Windows
      - name: Test
        run: |
          cargo test --no-fail-fast -p czkawka_core -p krokiet
